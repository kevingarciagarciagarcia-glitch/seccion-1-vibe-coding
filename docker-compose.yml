version: "3.9"

services:
  # ─────────────────────────────────────────
  # Base de datos MySQL 8
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: tallerdae_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Puerto NO expuesto al host — MySQL solo es accesible dentro de tallerdae_net
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d   # scripts SQL opcionales de inicialización
    networks:
      - tallerdae_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # Administrador de base de datos — Adminer
  # Acceso: http://localhost:${ADMINER_PORT}
  # ─────────────────────────────────────────
  adminer:
    image: adminer:4-standalone
    container_name: tallerdae_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha       # tema limpio, hay más en https://www.adminer.org/en/themes/
    networks:
      - tallerdae_net
    depends_on:
      mysql:
        condition: service_healthy

  # ─────────────────────────────────────────
  # App de prueba — Node.js hello-world
  # Solo accesible dentro de tallerdae_net;
  # Nginx hace de proxy en /api/
  # ─────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: tallerdae_app
    restart: unless-stopped
    # Puerto NO expuesto al host — el acceso es solo via Nginx en /api/
    networks:
      - tallerdae_net

  # ─────────────────────────────────────────
  # Servidor web / reverse proxy Nginx
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tallerdae_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx              # logs accesibles desde el host
    networks:
      - tallerdae_net
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

# ─────────────────────────────────────────
# Volúmenes y redes
# ─────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

networks:
  tallerdae_net:
    driver: bridge
