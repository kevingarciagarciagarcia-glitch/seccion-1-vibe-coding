<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taller DAE — Ambiente de Desarrollo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 3rem 4rem;
      max-width: 560px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .badge {
      display: inline-block;
      background: #22c55e20;
      color: #22c55e;
      border: 1px solid #22c55e40;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .05em;
      padding: .25rem .75rem;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: .75rem;
      line-height: 1.2;
    }

    h1 span { color: #38bdf8; }

    p.subtitle {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .services {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .service {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .75rem 1.25rem;
      font-size: .875rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    footer {
      margin-top: 2.5rem;
      font-size: .75rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">&#x2022; Ambiente activo</span>
    <h1>Bienvenido a <span>Taller DAE</span></h1>
    <p class="subtitle">
      Ambiente local de desarrollo y pruebas.<br/>
      Los servicios están corriendo correctamente.
    </p>

    <div class="services">
      <div class="service"><span class="dot"></span> Nginx&nbsp;(proxy)</div>
      <div class="service"><span class="dot"></span> MySQL&nbsp;8</div>
    </div>

    <footer>Desarrollo de Aplicaciones Empresariales &mdash; Docker Compose</footer>
  </div>
</body>
</html>
